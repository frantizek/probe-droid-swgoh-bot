[project]
name = "probe-droid-swgoh-bot"
version = "0.1.0"
description = "Bot de Discord para detectar códigos regalo y promociones de SWGoH"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "discord-py>=2.7.1",
    "feedparser>=6.0.12",
    "pymongo>=4.7.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
